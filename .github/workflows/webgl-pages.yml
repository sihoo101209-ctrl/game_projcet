# WebGL 데모 빌드 → GitHub Pages 배포
# 필요한 Secrets: UNITY_LICENSE (Unity_lic.ulf 내용), UNITY_EMAIL, UNITY_PASSWORD
# 필요한 설정: Settings → Pages → Source = "GitHub Actions"
name: WebGL Demo

on:
  push:
    branches: [claude/annyeong-m6eeaa, main]
  workflow_dispatch:

concurrency:
  group: webgl-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: WebGL
          allowDirtyBuild: true

      - name: Fix permissions
        run: sudo chown -R $USER build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
